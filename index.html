<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0426">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="霓虹转环">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>霓虹转环 NEON LOOPS · 试玩版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div class="scanlines"></div>

  <header id="hud">
    <button id="btnMenu" class="icon" aria-label="关卡">☰</button>
    <div class="title">
      <div id="lvNum">LEVEL 1</div>
      <div id="lvName"></div>
    </div>
    <div id="scoreBox"><span id="score">0</span></div>
    <button id="btnMute" class="icon" aria-label="声音">♪</button>
  </header>

  <div id="banner"><span>困难</span><small>HARD</small></div>
  <div id="tip"></div>

  <footer id="tools">
    <button id="btnReset">⟲<span>重来</span></button>
    <button id="btnHint">✦<span>提示</span></button>
  </footer>

  <section id="menu" class="overlay">
    <div class="panel">
      <h1 class="logo">霓虹转环<em>NEON LOOPS</em></h1>
      <p class="sub">日落海岸 · 试玩版</p>
      <div id="levels"></div>
      <div class="bgtitle">背景</div>
      <div id="bgs"></div>
      <p class="how">拖动圆环，把缺口转到夹套处让它滑脱。<br>身上没有任何连接的环会飞走，全部飞走就过关。</p>
    </div>
  </section>

  <section id="win" class="overlay">
    <div class="panel">
      <h2 id="winTitle" class="logo small">Nice!</h2>
      <div id="winScore" class="bigscore">0</div>
      <p id="winInfo"></p>
      <div class="row">
        <button id="btnRetry">重玩</button>
        <button id="btnNext" class="primary">下一关 ›</button>
      </div>
    </div>
  </section>

  <script src="src/core.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/bg.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
