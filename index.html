<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0426">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon Loops">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>NEON LOOPS · Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div class="scanlines"></div>

  <header id="hud">
    <button id="btnSettings" class="icon" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
    <div class="title">
      <div id="lvName"></div>
      <div id="lvNum">LEVEL 1</div>
    </div>
    <div id="scoreBox"><span id="score">0</span></div>
  </header>

  <div id="banner"><span id="bannerText">HARD</span></div>
  <div id="tip"></div>

  <footer id="tools">
    <button id="btnReset"><b>⟲</b><span data-i18n="restart">Restart</span></button>
    <button id="btnHint"><b>✦</b><span data-i18n="hint">Hint</span></button>
  </footer>

  <!-- 陪玩角色（右下角） -->
  <div id="girl" class="girl" aria-hidden="true">
    <div class="g-sway"><div class="g-breathe"><div class="g-pop">
      <img id="girlA" class="on" alt="" decoding="async"><img id="girlB" alt="" decoding="async"><img id="girlBlink" alt="" decoding="async">
    </div></div></div>
    <div id="bubble" class="bubble"></div>
  </div>

  <!-- 设置 -->
  <section id="settings" class="overlay">
    <div class="panel settings">
      <button id="btnCloseSettings" class="close" aria-label="Close">×</button>
      <h2 class="ptitle" data-i18n="settings">Settings</h2>
      <div class="toggles">
        <button id="togMusic" class="tog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 18.5a3 3 0 1 1-2-2.8V5l12-2v12.5a3 3 0 1 1-2-2.8V7.2l-8 1.4z"/></svg>
          <span data-i18n="music">Music</span>
        </button>
        <button id="togSound" class="tog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.8 5.7a9 9 0 0 1 0 12.6l-1.4-1.4a7 7 0 0 0 0-9.8z"/></svg>
          <span data-i18n="sound">Sound</span>
        </button>
        <button id="togVibe" class="tog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v14h8V5zM3 8h2v8H3zm16 0h2v8h-2z"/></svg>
          <span data-i18n="vibration">Vibration</span>
        </button>
      </div>
      <button id="btnLang" class="rowbtn">
        <span class="ico">A</span><span class="lbl" data-i18n="language">Language</span><span id="langVal" class="val"></span><span class="chev">›</span>
      </button>
      <div id="langList" class="langlist"></div>
      <div class="row">
        <button id="btnHome" class="secondary"><span data-i18n="home">Home</span></button>
        <button id="btnRestart" class="primary"><span data-i18n="restart">Restart</span></button>
      </div>
    </div>
  </section>

  <!-- 主页：选关 + 背景 -->
  <section id="menu" class="overlay">
    <div class="panel">
      <h1 class="logo">NEON<em>LOOPS</em></h1>
      <p class="sub" data-i18n="subtitle">Sunset Coast · Demo</p>
      <div id="levels"></div>
      <button id="btnAlbum" class="rowbtn albumbtn"><span class="ico">✦</span><span class="lbl" data-i18n="album">Album</span><span id="albumNew" class="newdot"></span><span class="chev">›</span></button>
      <p class="how" data-i18n="how"></p>
    </div>
  </section>

  <section id="win" class="overlay">
    <div class="panel">
      <h2 id="winTitle" class="logo small">Nice!</h2>
      <div id="winScore" class="bigscore">0</div>
      <p id="winInfo"></p>
      <button id="winPhoto" class="winphoto"><img id="winPhotoImg" alt=""><span><b data-i18n="newPhoto">New photo unlocked!</b><small data-i18n="tapToView">Tap to view</small></span></button>
      <div class="row">
        <button id="btnRetry" class="secondary"><span data-i18n="retry">Retry</span></button>
        <button id="btnNext" class="primary"><span id="btnNextLabel" data-i18n="next">Next ›</span></button>
      </div>
    </div>
  </section>

  <section id="album" class="overlay">
    <div class="panel album">
      <button id="btnCloseAlbum" class="close" aria-label="Close">×</button>
      <h2 class="ptitle" data-i18n="album">Album</h2>
      <div id="albumBody"></div>
    </div>
  </section>

  <section id="viewer" class="overlay viewer">
    <img id="viewImg" alt="">
    <video id="viewVid" playsinline controls preload="none"></video>
    <button id="btnCloseViewer" class="close" aria-label="Close">×</button>
  </section>

  <script src="src/i18n.js"></script>
  <script src="src/haptics.js"></script>
  <script src="src/core.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/chapters.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/bg.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
