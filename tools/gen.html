<!doctype html>
<meta charset="utf-8">
<title>gen</title>
<script src="../src/core.js"></script>
<pre id="out"></pre>
<script>
  /*
   * 关卡生成器：结构（谁扣谁、方位、有没有凸钉）由模板手工指定，
   * 缺口朝向、初始角度、凸钉方位按种子随机。每个模板尝试很多种子，
   * 过滤掉不合法或无解的，按目标难度挑一个。
   * 难度指标：par = 最少拖动次数；trap = 第一步可选走法里会让最少步数变多的比例。
   */
  const C = RRCore;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // 树形模板：每个节点 [id, 父 id, 方位角, 半径, 选项]；父扣子（父是主环）
  function tree(nodes, extraLinks, bars) {
    const pos = {};
    const rings = [], links = [];
    for (const [id, parent, dir, r, opt] of nodes) {
      let x = 0, y = 0;
      if (opt && opt.at && parent) { x = opt.at[0]; y = opt.at[1]; links.push([parent, id]); }
      else if (parent) {
        const P = pos[parent], d = P.r + r + (opt && opt.stem || 18);
        x = P.x + Math.cos(dir * C.DEG) * d; y = P.y + Math.sin(dir * C.DEG) * d;
        links.push([parent, id]);
      } else if (opt && opt.at) { x = opt.at[0]; y = opt.at[1]; }
      pos[id] = { x, y, r };
      rings.push({ id, x: Math.round(x), y: Math.round(y), r, opt: opt || {} });
    }
    const all = links.concat(extraLinks || []).map(([o, h]) => (pos[o].r > 90 ? [h, o] : [o, h]));
    for (const [id, owner, dir, len, opt] of bars || []) {
      // 直杆垂直于主环伸出的杆，套筒先放在直杆正中，生成时再随机错开
      const P = pos[owner], d = P.r + ((opt && opt.stem) || 16);
      const x = P.x + Math.cos(dir * C.DEG) * d, y = P.y + Math.sin(dir * C.DEG) * d;
      rings.push({ id, type: 'bar', x: Math.round(x), y: Math.round(y), dir: dir + 90, len, opt: opt || {} });
      all.push([owner, id]);
    }
    return { rings, links: all };
  }

  const TEMPLATES = {
    L1: () => tree([
      ['a', null, 0, 46, { at: [-56, 0] }],
      ['b', 'a', 0, 46, {}],
    ]),
    L2: () => tree([
      ['a', null, 0, 44, { at: [0, -110] }],
      ['b', 'a', 90, 46, {}],
      ['c', 'b', 90, 44, {}],
      ['d', 'b', 0, 38, { stem: 16 }],
    ]),
    L3: () => tree([
      ['h', null, 0, 42, { at: [0, 10], closed: true }],
      ['a', 'h', -90, 42, { knob: true }],
      ['b', 'h', 30, 42, { knob: true }],
      ['c', 'h', 150, 42, { knob: true }],
      ['e', 'a', -90, 36, { stem: 16 }],
    ]),
    // 两个闭合环用一座“桥”连起来：桥同时被两边扣住
    L4: () => tree([
      ['h1', null, 0, 40, { at: [-95, 0], closed: true }],
      ['h2', null, 0, 40, { at: [95, 0], closed: true }],
      ['m', 'h1', 0, 40, { stem: 15 }],
      ['a', 'h1', -120, 38, { knob: true }],
      ['b', 'h1', 120, 38, {}],
      ['c', 'h2', -60, 38, { knob: true }],
      ['d', 'h2', 60, 38, {}],
      ['e', 'd', 60, 36, { knob: true }],
    ], [['h2', 'm']]),
    // 树形 + 一个被两边扣住的环，多根凸钉互相卡位
    L5: () => tree([
      ['h', null, 0, 40, { at: [-20, -20], closed: true }],
      ['a', 'h', -90, 40, { knob: true }],
      ['b', 'h', 150, 40, { knob: true }],
      ['m', 'h', 30, 40, {}],
      ['r', null, 0, 40, { at: [150, -69] }],
      ['n', 'r', -90, 34, { stem: 16, knob: true }],
      ['g', 'a', -90, 34, { stem: 16 }],
      ['k', 'b', 180, 36, { knob: true, stem: 16 }],
      ['d', 'm', 90, 38, { knob: true }],
      ['e', 'd', 150, 34, { knob: true, stem: 16 }],
    ], [['r', 'm']]),
    // 第 8 关：底下一排三个闭合环，两座桥托着上面的塔（对标原作第 8 关：高、底部是闭合环）
    L8: () => tree([
      ['h1', null, 0, 36, { at: [-120, 90], closed: true }],
      ['h2', null, 0, 36, { at: [0, 90], closed: true }],
      ['h3', null, 0, 36, { at: [120, 90], closed: true }],
      ['x1', 'h1', 0, 44, { at: [-60, 10] }], ['x2', 'h3', 0, 44, { at: [60, 10] }],
      ['t', 'x1', 0, 44, { at: [0, -80] }],
      ['u', 't', -90, 38, {}],
      ['w1', 'u', -45, 34, { stem: 16, knob: true }], ['w2', 'u', -135, 34, { stem: 16, knob: true }],
      ['s1', 'h1', 120, 38, { knob: true }], ['s2', 'h2', 90, 38, {}], ['s3', 'h3', 60, 38, { knob: true }],
    ], [['h2', 'x1'], ['h2', 'x2']]),
    // 第 9 关：两个闭合环在上，中间两座小桥，下面挂一串
    L9: () => tree([
      ['h1', null, 0, 38, { at: [-80, -110], closed: true }],
      ['h2', null, 0, 38, { at: [90, -120], closed: true }],
      ['m', 'h1', 0, 31, { at: [5, -115] }],
      ['a', 'h1', 150, 38, { knob: true }], ['b', 'h1', 90, 38, {}],
      ['c', 'h2', 30, 38, { knob: true }], ['d', 'h2', 90, 38, {}],
      ['n', 'b', 0, 31, { at: [5, -21] }],
      ['g', 'a', 90, 34, { stem: 16, knob: true }], ['k', 'c', 90, 34, { stem: 16, knob: true }],
      ['p', 'n', 90, 38, { stem: 16, knob: true }],
    ], [['h2', 'm']], [
      ['z1', 'h2', -60, 90, {}],
      ['z2', 'p', 90, 100, {}],
    ]),
    // 第 10 关：一个大 C 环包住两个小环，外面还有环扣着它（对标原作第 10 关的大环）
    L10: () => tree([
      ['B', null, 0, 100, { at: [0, 0], knob: true }],
      ['i1', 'B', 0, 30, { at: [-45, -26] }],
      ['o1', 'B', -90, 34, { stem: 18 }],
      ['o2', 'B', 180, 36, { knob: true }], ['o3', 'B', 0, 36, { knob: true }],
      ['p2', 'o2', 135, 32, { stem: 16, knob: true }], ['p3', 'o3', 45, 32, { stem: 16 }],
      ['q', 'o1', -90, 32, { stem: 16, knob: true }],
    ], [], [
      ['z1', 'i1', 60, 56, {}],
      ['z2', 'o1', 0, 86, {}],
    ]),
  };
  const TARGET = { L1: [1, 1, 0], L2: [3, 3, 0.2], L3: [4, 5, 0.3], L4: [6, 9, 0.35], L5: [8, 12, 0.45], L6: [10, 16, 0.15], L7: [9, 13, 0.3], L8: [9, 16, 0.35], L9: [9, 15, 0.4], L10: [7, 16, 0.5] };
  const SEEDS = { L1: 60, L2: 120, L3: 300, L4: 40, L5: 60, L6: 12, L7: 40, L8: 30, L9: 40, L10: 60 };
  const q = new URLSearchParams(location.search), only = q.get('only');
  if (q.get('seeds')) Object.keys(SEEDS).forEach((k) => { SEEDS[k] = +q.get('seeds'); });

  function instantiate(T, seed) {
    const R = rng(seed), lv = { rings: [], links: T.links };
    // 先用 core 算出每条连接真实的杆根方向和夹套方向（套在大环里时方向是反的）
    const geo = C.build({ rings: T.rings.map((r) => (r.type === 'bar' ? r : { id: r.id, x: r.x, y: r.y, r: r.r, angle: 0 })), links: T.links });
    const idOf = (i) => T.rings[i].id;
    const dirsOf = (id) => {
      const out = [];
      for (const L of geo.links) {
        if (idOf(L.owner) === id) out.push(L.stubAt / C.DEG);
        if (idOf(L.held) === id) out.push(L.clampAng / C.DEG);
      }
      return out;
    };
    for (const r of T.rings) {
      if (r.type === 'bar') {
        const len = r.len + Math.round((R() - 0.5) * 16);
        const off = (R() - 0.5) * (len - C.CLAMP_LEN - 20);
        const u = r.dir * C.DEG;
        lv.rings.push({ id: r.id, type: 'bar', x: Math.round(r.x + Math.cos(u) * off), y: Math.round(r.y + Math.sin(u) * off), dir: r.dir, len });
        continue;
      }
      const ring = { id: r.id, x: r.x, y: r.y, r: r.r };
      const avoid = dirsOf(r.id);
      if (!r.opt.closed) {
        const w = 96 + Math.round(R() * 12);
        ring.gap = { at: 0, w };
        const ok = [];
        for (let a = 0; a < 360; a += 3) if (avoid.every((v) => Math.abs(C.angDiff(a * C.DEG, v * C.DEG)) > (w / 2 + 14) * C.DEG)) ok.push(a);
        if (!ok.length) { window.noGap = r.id + ' gap avoid=' + avoid.map(Math.round).join(','); return null; }
        ring.angle = ok[Math.floor(R() * ok.length)];
      } else ring.angle = 0;
      if (r.opt.knob) {
        // 凸钉只能长在实心管子上：避开缺口、杆和夹套；还要伸到空地里，不能一开始就顶着别的环
        const w = ring.gap ? ring.gap.w : 0, len = 20 + Math.round(R() * 6);
        const linkGap = (C.CLAMP_LEN + C.KNOB * 2) / r.r + 4 * C.DEG;
        const ok = [];
        for (let a = 0; a < 360; a += 3) {
          if (ring.gap && Math.abs(C.angDiff(a * C.DEG, 0)) <= (w / 2 + 22) * C.DEG) continue;
          const world = (a + ring.angle) * C.DEG;
          if (avoid.some((v) => Math.abs(C.angDiff(world, v * C.DEG)) <= linkGap)) continue;
          let clear = true;
          for (let t = r.r + 8; t <= r.r + len + C.KNOB && clear; t += 4) {
            const px = r.x + Math.cos(world) * t, py = r.y + Math.sin(world) * t;
            for (const q of T.rings) {
              if (q.id === r.id) continue;
              if (Math.abs(Math.hypot(px - q.x, py - q.y) - q.r) < C.TUBE / 2 + C.KNOB + 3) { clear = false; break; }
            }
          }
          if (clear) ok.push(a);
        }
        if (!ok.length) { window.noGap = r.id + ' knob'; return null; }
        ring.knobs = [{ at: ok[Math.floor(R() * ok.length)], len }];
      }
      lv.rings.push(ring);
    }
    return lv;
  }

  function measure(lv) {
    const G = C.build(lv);
    const probs = C.validate(G);
    if (probs.length) return { bad: probs[0] };
    const s0 = C.initState(G);
    const big = lv.rings.length > 9;
    let res = C.solve(G, s0, { maxDepth: 20, maxNodes: big ? 15000 : 60000 }), approx = false;
    if (!res.moves) {
      const f = C.solveFast(G, s0, { maxNodes: +(q.get('fast') || (big ? 30000 : 80000)) });
      if (!f.moves) return { bad: f.aborted ? 'aborted' : 'unsolvable' };
      res = f; approx = true;
    }
    const par = res.moves.length;
    let total = 0, worse = 0;
    for (let i = 0; i < G.rings.length; i++) {
      if (C.blockReason(G, s0, i)) continue;
      for (const d of [1, -1]) {
        const n = C.cloneState(s0);
        const moved = C.sweep(G, n, i, d * Math.PI, null);
        if (Math.abs(moved) < 2 * C.DEG) continue;
        total++;
        if (big) { const r2 = C.solveFast(G, n, { maxNodes: 15000 }); if (!r2.moves) worse++; }
        else { const r2 = C.solve(G, n, { maxDepth: par + 2, maxNodes: 30000 }); if (!r2.moves || r2.moves.length + 1 > par) worse++; }
      }
    }
    return { par, approx, trap: total ? worse / total : 0, sol: res.moves };
  }

  const out = [];
  for (const [name, mk] of Object.entries(TEMPLATES)) {
    if (only && only !== name) continue;
    const T = mk(), [lo, hi, trapT] = TARGET[name];
    let best = null, stats = {};
    const seed0 = +(q.get('seed0') || 1);
    for (let seed = seed0; seed < seed0 + SEEDS[name]; seed++) {
      const lv = instantiate(T, seed);
      if (!lv) { stats.nogap = (stats.nogap || 0) + 1; if (q.get('debug')) out.push('  ' + seed + ' nogap ' + window.noGap); continue; }
      const m = measure(lv);
      if (m.bad) { const k = m.bad.split(' ')[0] + (m.bad.includes('collides') ? 'C' : ''); stats[k] = (stats[k] || 0) + 1; if (q.get('debug')) out.push('  ' + seed + ' ' + m.bad); continue; }
      stats.ok = (stats.ok || 0) + 1; stats['p' + m.par] = (stats['p' + m.par] || 0) + 1;
      if (m.par < lo || m.par > hi) continue;
      const score = Math.abs(m.trap - trapT) + (hi - m.par) * 0.02;
      if (!best || score < best.score) best = { seed, score, lv, m };
    }
    out.push(name + ' stats=' + JSON.stringify(stats));
    if (best) out.push(name + ' seed=' + best.seed + ' par=' + best.m.par + (best.m.approx ? '~' : '') + ' trap=' + best.m.trap.toFixed(2) + '\n' + JSON.stringify(best.lv));
    else out.push(name + ' NO MATCH');
  }
  document.getElementById('out').textContent = out.join('\n');
</script>
