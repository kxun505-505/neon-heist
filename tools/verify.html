<!doctype html>
<meta charset="utf-8">
<title>verify</title>
<!--
  关卡验收（浏览器版，和 node tools/levelgen/cli.js check 是同一份代码）：
  合法性、可解、尺寸、避让陪玩角色、难度曲线、节奏和结构，标准见 docs/level-rules.md。
  用法：tools/verify.sh（默认就是这个页面）
-->
<script src="../src/core.js"></script>
<script src="../src/layout.js"></script>
<script src="../src/chapters.js"></script>
<script src="../src/levels.js"></script>
<script src="levelgen/curve.js"></script>
<script src="levelgen/levelgen.js"></script>
<pre id="out"></pre>
<script>
  const rows = RRGen.checkAll(RRLevels), out = [];
  for (const r of rows) {
    const m = r.m;
    out.push(JSON.stringify({
      level: r.n, name: RRLevels[r.n - 1].en, hard: RRGen.isHard(r.n), pieces: m.pieces, par: m.par, exact: m.exact,
      trap: m.trap, dead: m.dead, revisit: m.revisit, D: m.D, minRingPx: m.minRingPx, tubePx: m.tubePx, ms: m.ms,
      result: r.fails.length ? 'FAIL' : 'PASS', fails: r.fails, solution: m.solution,
    }));
  }
  const bad = rows.filter((r) => r.fails.length).length;
  out.push(bad ? `FAIL ${bad} 关没通过验收` : `PASS ${rows.length} 关全部通过验收`);
  document.getElementById('out').textContent = out.join('\n');
</script>
