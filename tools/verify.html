<!doctype html>
<meta charset="utf-8">
<title>verify</title>
<!-- 关卡检查：合法性（无重叠、无初始碰撞、无已滑脱的夹套）+ 最少拖动次数 -->
<script src="../src/core.js"></script>
<script src="../src/levels.js"></script>
<pre id="out"></pre>
<script>
  const C = RRCore, out = [];
  RRLevels.forEach((lv, n) => {
    const G = C.build(lv);
    const problems = C.validate(G);
    const t = performance.now();
    let res = C.solve(G, C.initState(G), { maxDepth: 20, maxNodes: lv.rings.length > 9 ? 15000 : 200000 }), approx = false;
    if (!res.moves) { res = C.solveFast(G, C.initState(G), { maxNodes: 80000 }); approx = true; }
    out.push(JSON.stringify({
      level: n + 1, name: lv.en, rings: lv.rings.length, links: lv.links.length,
      problems, par: res.moves ? res.moves.length : null, approx,
      solution: res.moves ? res.moves.map((m) => lv.rings[m.ring].id + Math.round(m.delta / C.DEG)).join(' ') : null,
      ms: Math.round(performance.now() - t),
    }));
  });
  document.getElementById('out').textContent = out.join('\n');
</script>
