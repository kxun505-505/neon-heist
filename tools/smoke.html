<!doctype html>
<meta charset="utf-8">
<title>smoke</title>
<!--
  冒烟测试：走真实的开机路径（不带 ?level），模拟“已经玩到第 6 关”的存档，
  再点一遍主页、选关、设置、语言、背景、过关、下一关，收集所有报错。
-->
<iframe id="f" style="width:390px;height:844px;border:0"></iframe>
<pre id="out"></pre>
<script>
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const log = [];
  const out = () => { document.getElementById('out').textContent = log.join('\n'); };
  const f = document.getElementById('f');
  function load(url) { return new Promise((r) => { f.onload = () => r(f.contentWindow); f.src = url; }); }
  async function run() {
    let w = await load('../index.html');
    w.localStorage.clear();
    w.localStorage.setItem('neonloops-progress-v2', JSON.stringify({ 0: 800, 1: 2200, 2: 3200, 3: 6000, 4: 7000 }));
    w = await load('../index.html?' + Date.now());
    const errs = [];
    w.addEventListener('error', (e) => errs.push(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
    await sleep(600);
    const d = w.document, $ = (id) => d.getElementById(id);
    const check = (name, ok) => log.push((ok ? 'OK   ' : 'FAIL ') + name);
    const st = () => w.__neon.state;
    for (let k = 0; k < 30 && st().frameCount === 0; k++) await sleep(100); // 等第一帧（无头浏览器里第一帧可能晚到，最后再统一检查）
    check('开机停在第 6 关并打开主页', st().levelIndex === 5 && $('menu').classList.contains('show'));
    check('主页转盘列出第 1 章的 20 关', d.querySelectorAll('#levels .lvcard').length === 20);
    const chips = d.querySelectorAll('#chapters .chip');
    check('第 1 章按钮显示进度（' + chips[0].textContent + '）', chips[0].classList.contains('on') && /SUNSET COAST/.test(chips[0].textContent) && /5\/20/.test(chips[0].textContent));
    check('第 2 章没解锁：按钮锁住', chips.length === 4 && chips[1].classList.contains('locked'));
    chips[1].click(); await sleep(80);
    check('点锁住的章节写明解锁标准（' + $('chapterNote').textContent + '）', /20/.test($('chapterNote').textContent) && chips[0].classList.contains('on'));
    check('转盘停在第 6 关，开始按钮写着第 6 关（' + $('playLabel').textContent + '）', /6/.test($('playLabel').textContent) && !$('btnPlay').classList.contains('locked'));
    const strip = d.querySelectorAll('#albumStrip .ph');
    check('主页顶部相册条：20 格，前 5 格已解锁（' + $('albumCount').textContent + '）', strip.length === 20 && strip[0].classList.contains('got') && strip[4].classList.contains('got') && /5\/20/.test($('albumCount').textContent));
    check('下一张照片模糊预览', strip[5].classList.contains('tease'));
    const hb = $('menu').querySelector('.halbum').getBoundingClientRect();
    check('相册占主页高度 30-40%（' + Math.round(hb.height / w.innerHeight * 100) + '%）', hb.height / w.innerHeight >= 0.3 && hb.height / w.innerHeight <= 0.4);
    const mb = $('menu').querySelector('.homebox');
    check('主页一屏放下，不用上下滚动', mb.scrollHeight <= mb.clientHeight + 1 && $('btnPlay').getBoundingClientRect().bottom <= w.innerHeight);
    check('标题是“章节名 · 章内关卡号”：' + $('lvName').textContent + ' / ' + $('lvNum').textContent, $('lvName').textContent === 'SUNSET COAST · 6' && $('lvNum').textContent === 'LEVEL 6');
    // 相册：存档通关了第 1-5 关。第 1-5 关的奖励已经换成剧情（第 1 集，在相册最上面的「剧情」里）；
    // 第 1 章的照片和视频从第 6 关开始：3 行 ×（4 张照片 + 1 段视频）= 15 格，都还锁着；第 11 关以后的素材还没做
    $('btnAlbum').click(); await sleep(150);
    const story = d.querySelector('#albumBody .astory');
    const eps = story ? story.querySelectorAll('.epcard') : [];
    check('相册最上面是剧情：第 1 集（第 1-5 关）已解锁 5/5', $('album').classList.contains('show') && eps.length === 1 && !eps[0].classList.contains('locked') && /5\/5/.test(eps[0].textContent));
    const secs = d.querySelectorAll('#albumBody .asec:not(.astory)'), sec0 = secs[0];
    const slots = sec0.querySelectorAll('.aslot');
    check('相册第 1 章：3 行 × (4 张照片 + 1 段视频) = ' + slots.length + ' 格', slots.length === 15);
    check('照片 5 还锁着（要通关第 6 关）', !slots[0].classList.contains('got') && /6/.test(slots[0].textContent));
    check('第 11 关以后的照片显示即将上线', /Coming soon/.test(slots[5].textContent));
    check('第 1 章背景已解锁', sec0.querySelector('.abg').classList.contains('got'));
    const sec1 = secs[1];
    check('第 2 章背景锁住，要通关第 1 章全部 20 关（' + sec1.querySelector('.abg').textContent + '）', !sec1.querySelector('.abg').classList.contains('got') && /20/.test(sec1.querySelector('.abg').textContent));
    eps[0].click(); await sleep(150);
    check('点第 1 集，从头连播剧情', $('story').classList.contains('show') && /p01/.test($('storyImg').src));
    $('btnStorySkip').click(); await sleep(80);
    check('跳过后剧情关闭，回到相册', !$('story').classList.contains('show') && $('album').classList.contains('show'));
    d.querySelectorAll('#albumBody .asec:not(.astory)')[0].querySelector('.abg').click(); await sleep(100);
    check('点背景卡打开背景大图', $('viewer').classList.contains('show') && /^data:image/.test($('viewImg').src));
    $('btnCloseViewer').click(); await sleep(50);
    $('btnCloseAlbum').click(); await sleep(50);
    check('右下角陪玩角色已加载（表情 ' + w.__neon.girl() + '）', /idle/.test($('girlA').src) || /idle/.test($('girlB').src));
    check('第 6 关的零件都在（' + st().ring.filter(Boolean).length + ' 个）', st().ring.filter(Boolean).length === w.RRLevels[5].rings.length);
    // 选第 2 关
    d.querySelectorAll('#levels .lvcard')[1].click(); await sleep(400);
    check('点旁边的关卡卡片先滑到中间（' + $('playLabel').textContent + '）', /2$/.test($('playLabel').textContent) && $('menu').classList.contains('show'));
    d.querySelectorAll('#levels .lvcard')[1].click(); await sleep(150);
    check('再点中间的卡片进入第 2 关', st().levelIndex === 1 && !$('menu').classList.contains('show'));
    // 设置
    $('btnSettings').click(); await sleep(100);
    check('设置面板打开', $('settings').classList.contains('show'));
    const vibe0 = w.RRHaptics.enabled; $('togVibe').click(); await sleep(50);
    check('震动开关可以切换', w.RRHaptics.enabled !== vibe0); $('togVibe').click();
    const snd0 = w.RRAudio.muted; $('togSound').click(); await sleep(50);
    check('音效开关可以切换', w.RRAudio.muted !== snd0); $('togSound').click();
    $('togMusic').click(); await sleep(50); $('togMusic').click();
    $('btnLang').click(); await sleep(50);
    check('语言列表展开（' + $('langList').children.length + ' 种）', $('langList').classList.contains('open') && $('langList').children.length === 6);
    for (const b of [...$('langList').children]) {
      if (!$('langList').classList.contains('open')) { $('btnLang').click(); await sleep(40); }
      b.click(); await sleep(320);
      check('选完语言下拉自动收起', !$('langList').classList.contains('open'));
      const code = b.dataset.code;
      check('切换到 ' + code + '：标题 = ' + d.querySelector('.ptitle').textContent + '，关卡 = ' + $('lvNum').textContent, w.RRI18n.lang === code);
    }
    $('btnLang').click(); await sleep(40); [...$('langList').children][0].click(); await sleep(320);
    $('btnHome').click(); await sleep(100);
    check('设置里点 Home 回到主页', $('menu').classList.contains('show') && !$('settings').classList.contains('show'));
    d.querySelectorAll('#levels .lvcard')[0].click(); await sleep(400); $('btnPlay').click(); await sleep(150);
    $('btnSettings').click(); await sleep(50); $('btnRestart').click(); await sleep(100);
    check('设置里点 Restart 重开当前关', st().levelIndex === 0 && st().moves === 0 && !$('settings').classList.contains('show'));
    // 用提示一步步通关第 1 关，然后点下一关
    const C = w.RRCore, G = C.build(w.RRLevels[0]), cv = $('game');
    const fire = (type, p) => cv.dispatchEvent(new w.PointerEvent(type, { pointerId: 3, clientX: p.x, clientY: p.y, bubbles: true, isPrimary: true, pointerType: 'touch' }));
    for (let k = 0; k < 5 && !st().won; k++) {
      const s = st(), m = C.hintMove(G, { angles: s.angles, ring: s.ring, link: s.link }, 5000);
      if (!m) break;
      const R = G.rings[m.ring], a0 = Math.atan2(-R.y, -R.x) + Math.PI;
      const at = (a) => w.__neon.toScreen(R.x + Math.cos(a) * R.r, R.y + Math.sin(a) * R.r);
      fire('pointerdown', at(a0));
      for (let q = 1; q <= 30; q++) { fire('pointermove', at(a0 + (m.delta * q) / 30)); await sleep(5); }
      fire('pointerup', at(a0 + m.delta)); await sleep(50);
    }
    await sleep(2200);
    check('第 1 关通关并弹出过关面板', st().won && $('win').classList.contains('show'));
    check('过关时角色换成眨眼表情', w.__neon.girl() === 'wink');
    check('重玩已通关的第 1 关，不会再弹出新照片', !$('winPhoto').classList.contains('show'));
    check('过关按钮里的震动开关没被文字覆盖', !w.RRHaptics || $('btnNext').querySelector('span#btnNextLabel') != null);
    $('btnNext').click(); await sleep(200);
    check('点下一关进入第 2 关', st().levelIndex === 1 && !st().won);
    check('画面仍在绘制（frameCount=' + st().frameCount + '）', st().frameCount > 0);
    // 第 5 关（困难关）第一次通关 → 解锁视频 1：过关面板出现“新视频”，角色眨眼
    w.localStorage.setItem('neonloops-progress-v2', JSON.stringify({ 0: 800, 1: 2200, 2: 3200, 3: 6000 }));
    w.localStorage.removeItem('neonloops-seen');
    w = await load('../index.html?level=5&' + Date.now());
    w.addEventListener('error', (e) => errs.push(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
    await sleep(600);
    {
      const d2 = w.document, C2 = w.RRCore, G2 = C2.build(w.RRLevels[4]), cv2 = d2.getElementById('game');
      const st2 = () => w.__neon.state;
      const fire2 = (type, p) => cv2.dispatchEvent(new w.PointerEvent(type, { pointerId: 4, clientX: p.x, clientY: p.y, bubbles: true, isPrimary: true, pointerType: 'touch' }));
      for (let k = 0; k < 20 && !st2().won; k++) {
        const s2 = st2(), m = C2.hintMove(G2, { angles: s2.angles, ring: s2.ring, link: s2.link }, 20000);
        if (!m) break;
        const R = G2.rings[m.ring];
        let best = 0, bestD = -1;
        for (let q = 0; q < 72; q++) {
          const a = (q / 72) * C2.TAU, px = R.x + Math.cos(a) * R.r, py = R.y + Math.sin(a) * R.r;
          let dmin = Infinity;
          G2.rings.forEach((Q, j) => { if (j !== m.ring && s2.ring[j] && Q.kind !== 'bar') dmin = Math.min(dmin, Math.abs(Math.hypot(px - Q.x, py - Q.y) - Q.r)); });
          if (dmin > bestD) { bestD = dmin; best = a; }
        }
        const at = (a) => w.__neon.toScreen(R.x + Math.cos(a) * R.r, R.y + Math.sin(a) * R.r);
        fire2('pointerdown', at(best));
        const n = Math.max(2, Math.ceil(Math.abs(m.delta) / (4 * C2.DEG)));
        for (let q = 1; q <= n; q++) { fire2('pointermove', at(best + (m.delta * q) / n)); if (q % 4 === 0) await sleep(5); }
        fire2('pointerup', at(best + m.delta)); await sleep(40);
      }
      await sleep(2300);
      check('第 5 关通关', st2().won);
      check('过关面板显示“解锁了新剧情”（第 5 关是剧情视频）', d2.getElementById('winPhoto').classList.contains('show') && d2.getElementById('winPhoto').classList.contains('isvideo') && /story/i.test(d2.getElementById('winPhotoTitle').textContent));
      check('解锁剧情时角色眨眼（' + w.__neon.girl() + '）', w.__neon.girl() === 'wink');
      check('还没打完第 1 章，不会解锁新背景', !d2.getElementById('winBg').classList.contains('show'));
      d2.getElementById('winPhoto').click(); await sleep(100);
      check('点剧情卡播放第 5 关的剧情视频', d2.getElementById('story').classList.contains('show') && /v01\.mp4/.test(d2.getElementById('storyVid').getAttribute('src') || ''));
      d2.getElementById('btnStorySkip').click(); await sleep(80);
    }
    check('没有任何脚本报错', errs.length === 0);
    errs.forEach((e) => log.push('  ERROR ' + e));
    out();
  }
  run().catch((e) => { log.push('EXCEPTION ' + e.stack); out(); });
</script>
