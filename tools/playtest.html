<!doctype html>
<meta charset="utf-8">
<title>playtest</title>
<!-- 端到端试玩：用合成的触摸事件按求解器的步骤拖动，检查每关都能在最少拖动次数内通关 -->
<iframe id="f" src="../index.html?unlock&level=1" style="width:390px;height:844px;border:0"></iframe>
<pre id="out"></pre>
<script>
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const out = (t) => { document.getElementById('out').textContent = t; };
  const log = [];
  async function run() {
    const w = document.getElementById('f').contentWindow;
    while (!w.__neon) await sleep(50);
    const errs = []; w.addEventListener('error', (e) => errs.push(e.message + ' @' + e.lineno));
    const C = w.RRCore, cv = w.document.getElementById('game');
    const fire = (type, p) => cv.dispatchEvent(new w.PointerEvent(type, {
      pointerId: 7, clientX: p.x, clientY: p.y, bubbles: true, isPrimary: true, pointerType: 'touch',
    }));
    const from = +(new URLSearchParams(location.search).get('from') || 0);
    for (let n = from; n < w.RRLevels.length; n++) {
      w.__neon.loadLevel(n);
      await sleep(50);
      const G = C.build(w.RRLevels[n]);
      let guard = 0, par = null;
      while (!w.__neon.state.won && guard++ < 30) {
        const st = w.__neon.state;
        const s = { angles: st.angles, ring: st.ring, link: st.link };
        if (par == null) {
          const r0 = C.solve(G, C.cloneState(s), { maxDepth: 20, maxNodes: 15000 });
          par = r0.moves ? r0.moves.length : (C.solveFast(G, C.cloneState(s), { maxNodes: 80000 }).moves || []).length + '~';
        }
        const m = C.hintMove(G, s, 15000);
        if (!m) { log.push(`L${n + 1} stuck`); break; }
        const R = G.rings[m.ring];
        if (R.kind === 'bar') {
          const sv = s.angles[m.ring];
          const at = (t) => w.__neon.toScreen(R.x + R.ux * (sv + t), R.y + R.uy * (sv + t));
          fire('pointerdown', at(0));
          const steps = Math.max(2, Math.ceil(Math.abs(m.delta) / 3));
          for (let k = 1; k <= steps; k++) { fire('pointermove', at((m.delta * k) / steps)); if (k % 4 === 0) await sleep(8); }
          fire('pointerup', at(m.delta));
          await sleep(30);
          continue;
        }
        // 在环上找一个离别的物体最远的点下手，避免抓错环
        let best = 0, bestD = -1;
        for (let k = 0; k < 72; k++) {
          const a = (k / 72) * C.TAU, px = R.x + Math.cos(a) * R.r, py = R.y + Math.sin(a) * R.r;
          let dmin = Infinity;
          G.rings.forEach((Q, j) => { if (j !== m.ring && s.ring[j]) dmin = Math.min(dmin, Math.abs(Math.hypot(px - Q.x, py - Q.y) - Q.r)); });
          if (dmin > bestD) { bestD = dmin; best = a; }
        }
        const at = (a) => w.__neon.toScreen(R.x + Math.cos(a) * R.r, R.y + Math.sin(a) * R.r);
        fire('pointerdown', at(best));
        const steps = Math.max(2, Math.ceil(Math.abs(m.delta) / (4 * C.DEG)));
        for (let k = 1; k <= steps; k++) { fire('pointermove', at(best + (m.delta * k) / steps)); if (k % 4 === 0) await sleep(8); }
        fire('pointerup', at(best + m.delta));
        await sleep(30);
      }
      await sleep(2300);
      const st = w.__neon.state;
      const winShown = w.document.getElementById('win').classList.contains('show');
      log.push(`L${n + 1} won=${st.won} winPanel=${winShown} moves=${st.moves} par=${par} score=${st.score} ` +
        (st.won && winShown ? (String(st.moves) === String(par) ? 'OK' : 'OK(步数与参考解不同)') : 'FAIL') + (errs.length ? ' errors=' + errs.join(' | ') : ''));
      out(log.join('\n'));
    }
    out(log.join('\n'));
  }
  run().catch((e) => out(log.join('\n') + '\nERROR ' + e.stack));
</script>
